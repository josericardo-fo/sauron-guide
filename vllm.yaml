# Job de vLLM. Envie com: sauron submit -f vllm.yaml
# Com a imagem do vLLM ponha sempre script: (mesmo para um comando só): o comando vem do vllm.sh.
name: meu-vllm
image: vllm/vllm-openai:v0.29.0
gpus: 1
vram: 80
max_time: 2h

# script com os comandos do job, em bash (caminho relativo a esta pasta)
script: vllm.sh

# workspace: subpasta de ~/workspace com o seu código; o job já começa dentro dela
workspace: meu-projeto
